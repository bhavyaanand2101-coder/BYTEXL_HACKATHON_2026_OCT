[project]
name = "campuspulse"
version = "5.0.0"
description = "Smart Campus Analytics — Student Success Operating System (KPMG Hackathon)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    # --- Web framework ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # --- Data / pipeline ---
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    # --- DB / ORM ---
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # --- Config ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    # --- Auth / Security ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # --- Observability ---
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",        # test client
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "import-linter>=2.1",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ── import-linter ─────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "packages"

[[tool.importlinter.contracts]]
name = "Domain layer must not import I/O"
type = "forbidden"
source_modules = ["packages.domain"]
forbidden_modules = [
    "sqlalchemy", "asyncpg", "pandas", "openpyxl", "pyarrow",
    "fastapi", "uvicorn", "requests", "httpx", "aiohttp",
    "urllib", "socket", "subprocess", "os.system",
]
