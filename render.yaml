services:
  - type: web
    name: campuspulse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./campuspulse_local.db
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: STUDENT_ID_SALT
        value: campuspulse_salt_secret_2026
      - key: PYTHONPATH
        value: .
